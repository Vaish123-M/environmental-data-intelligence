<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Environmental Dashboard Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white rounded shadow p-6">
      <h1 class="text-2xl font-semibold mb-4">Environmental Dashboard (Demo)</h1>
      <canvas id="aqiChart" height="120"></canvas>
    </div>

    <script>
      async function fetchData(){
        const res = await fetch('/api/data');
        if(!res.ok) return [];
        const data = await res.json();
        return data;
      }

      function renderChart(labels, values){
        const ctx = document.getElementById('aqiChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'AQI',
              data: values,
              borderColor: 'rgba(59,130,246,1)',
              backgroundColor: 'rgba(59,130,246,0.2)',
              fill: true
            }]
          },
          options: { responsive: true }
        });
      }

      (async ()=>{
        const rows = await fetchData();
        if(rows.length===0){
          document.body.insertAdjacentHTML('beforeend','<p class="text-red-500">No data available. Start the backend.</p>');
          return;
        }
        const labels = rows.map(r => r.date);
        const values = rows.map(r => r.aqi);
        renderChart(labels, values);
      })();
    </script>
  </body>
</html>
