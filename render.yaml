# Render service definition - Native Python build (no Docker needed)
services:
  - type: web
    name: environmental-data-intelligence-api
    env: python
    pythonVersion: 3.11
    branch: deploy-minimal
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python ml/train_model.py || true
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: ""
        scope: env
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: env
